<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-51HHNSKYW4"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-51HHNSKYW4');

  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Movies & Shows — Photon</title>
  <meta name="description" content="Browse and watch movies and TV shows on Photon. Hundreds of titles available." />
  <meta name="robots" content="index, follow" />
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;700&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,1,0&display=swap" rel="stylesheet" />
  <style>
    main {
      padding: 2rem;
      min-height: calc(100vh - 60px);
    }

    .movies-header {
      text-align: center;
      margin-bottom: 3rem;
    }

    .movies-header h1 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: clamp(2rem, 5vw, 3.5rem);
      font-weight: 700;
      margin-bottom: 1rem;
    }

    .search-controls {
      display: flex;
      gap: 1rem;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 2rem;
      max-width: 800px;
      margin-left: auto;
      margin-right: auto;
    }

    .search-box {
      flex: 1;
      min-width: 200px;
      max-width: 500px;
    }

    .search-box input {
      width: 100%;
      padding: 0.75rem 1rem;
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text);
      font-size: 1rem;
      transition: border-color 0.2s;
    }

    .search-box input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }

    .type-filter select {
      padding: 0.75rem 1rem;
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text);
      font-size: 1rem;
      cursor: pointer;
      transition: border-color 0.2s;
    }

    .type-filter select:hover {
      border-color: var(--accent);
    }

    .movies-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 1.5rem;
      margin-bottom: 3rem;
    }

    .movie-card {
      position: relative;
      border-radius: var(--radius);
      overflow: hidden;
      background: var(--surface);
      border: 1px solid var(--border);
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .movie-card:hover {
      transform: translateY(-8px);
      box-shadow: 0 12px 40px rgba(124, 58, 237, 0.3);
    }

    .movie-poster {
      width: 100%;
      aspect-ratio: 2/3;
      background: var(--bg2);
      overflow: hidden;
    }

    .movie-poster img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .movie-info {
      padding: 1rem;
      background: var(--surface);
    }

    .movie-title {
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text);
      line-height: 1.2;
      margin-bottom: 0.5rem;
    }

    .movie-year {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.9);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 2rem;
      overflow-y: auto;
    }

    .modal.active {
      display: flex;
    }

    .modal-content {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 2rem;
      max-width: 900px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      position: relative;
    }

    .modal-close {
      position: absolute;
      top: 1rem;
      right: 1rem;
      background: transparent;
      border: none;
      color: var(--text);
      font-size: 1.5rem;
      cursor: pointer;
      padding: 0.5rem;
    }

    .modal-header {
      display: flex;
      gap: 2rem;
      margin-bottom: 2rem;
    }

    .modal-poster {
      width: 150px;
      flex-shrink: 0;
      border-radius: var(--radius-sm);
      overflow: hidden;
      aspect-ratio: 2/3;
      background: var(--bg2);
    }

    .modal-poster img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .modal-meta {
      flex: 1;
    }

    .modal-title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 2rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
      color: var(--text);
    }

    .modal-info {
      display: flex;
      gap: 1.5rem;
      margin-bottom: 1.5rem;
      font-size: 0.9rem;
      color: var(--text-muted);
      flex-wrap: wrap;
    }

    .modal-rating {
      color: var(--accent-bright);
      font-weight: 600;
    }

    .modal-description {
      color: var(--text-muted);
      line-height: 1.6;
      margin-bottom: 1.5rem;
    }

    .modal-controls {
      display: flex;
      gap: 1rem;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
    }

    .modal-controls select {
      padding: 0.5rem 1rem;
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text);
      cursor: pointer;
    }

    .iframe-wrap {
      width: 100%;
      aspect-ratio: 16/9;
      border-radius: var(--radius-sm);
      overflow: hidden;
      background: var(--bg);
      border: 1px solid var(--border);
    }

    .iframe-wrap iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    .loading {
      text-align: center;
      padding: 2rem;
      color: var(--text-muted);
    }

    .loading-spinner {
      display: inline-block;
      width: 40px;
      height: 40px;
      border: 4px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .empty-state {
      text-align: center;
      padding: 3rem;
      color: var(--text-muted);
    }

    @media (max-width: 768px) {
      .search-controls {
        flex-direction: column;
      }

      .movies-grid {
        grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
        gap: 1rem;
      }

      .modal-header {
        flex-direction: column;
      }

      .modal-content {
        padding: 1.5rem;
      }
    }
  </style>
</head>
<body>
  <nav class="navbar">
    <div class="nav-brand">
      <span class="material-symbols-rounded brand-icon">flare</span>
      <span class="brand-name">photon</span>
    </div>
    <div class="nav-links">
      <a href="/index.html" class="nav-link">Home</a>
      <a href="/games.html" class="nav-link">Games</a>
      <a href="/movies.html" class="nav-link active">Movies</a>
      <a href="/browser.html" class="nav-link">Browser</a>
      <a href="/chat.html" class="nav-link">Chat</a>
      <a href="/settings.html" class="nav-link">Settings</a>
    </div>
  </nav>

  <main>
    <div class="movies-header">
      <h1>Movies & Shows</h1>
    </div>

    <div class="search-controls">
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="Search movies & shows..." />
      </div>
      <div class="type-filter">
        <select id="typeSelect">
          <option value="all">All Types</option>
          <option value="movie">Movies</option>
          <option value="tv">Shows</option>
        </select>
      </div>
      <div class="type-filter">
        <select id="genreSelect">
          <option value="">All Genres</option>
        </select>
      </div>
    </div>

    <div class="movies-grid" id="moviesGrid"></div>
    <div class="loading" id="loadingIndicator" style="display: none;">
      <div class="loading-spinner"></div>
      <p style="margin-top: 1rem;">Loading...</p>
    </div>
    <div class="empty-state" id="emptyState" style="display: none;">
      <p>No results found. Try a different search.</p>
    </div>
  </main>

  <div class="modal" id="modal">
    <div class="modal-content">
      <button class="modal-close" onclick="closeModal()">✕</button>
      <div class="modal-header">
        <div class="modal-poster">
          <img id="modalPoster" src="" alt="poster" />
        </div>
        <div class="modal-meta">
          <div class="modal-title" id="modalTitle"></div>
          <div class="modal-info">
            <span id="modalYear"></span>
            <span id="modalType"></span>
            <span class="modal-rating" id="modalRating"></span>
          </div>
          <div class="modal-description" id="modalDescription"></div>
        </div>
      </div>
      <div class="modal-controls" id="modalControls"></div>
      <div class="iframe-wrap">
        <iframe id="modalIframe" allowfullscreen></iframe>
      </div>
    </div>
  </div>

  <script src="/js/bg.js"></script>
  <script src="/js/transitions.js"></script>
  <script src="/js/movies.js" type="module"></script>
</body>
</html>
