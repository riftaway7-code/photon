<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0d1f35"/>
      <stop offset="100%" stop-color="#060d18"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-strong" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1.2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background circle -->
  <circle cx="32" cy="32" r="32" fill="url(#bg)"/>

  <!-- Outer dim ring hint -->
  <circle cx="32" cy="32" r="28" fill="none" stroke="#1a3a5c" stroke-width="0.5" opacity="0.4"/>

  <!-- Main orbital ring glow layer -->
  <circle cx="32" cy="32" r="20" fill="none" stroke="#1e6fba" stroke-width="4" opacity="0.35" filter="url(#glow-strong)"/>
  <!-- Main orbital ring sharp -->
  <circle cx="32" cy="32" r="20" fill="none" stroke="#4ab3f4" stroke-width="1.6" filter="url(#glow-soft)"/>

  <!-- Tick marks on ring -->
  <line x1="32" y1="10.5" x2="32" y2="13.5" stroke="#3a9ad4" stroke-width="1" opacity="0.5"/>
  <line x1="32" y1="50.5" x2="32" y2="53.5" stroke="#3a9ad4" stroke-width="1" opacity="0.5"/>
  <line x1="10.5" y1="32" x2="13.5" y2="32" stroke="#3a9ad4" stroke-width="1" opacity="0.5"/>
  <line x1="50.5" y1="32" x2="53.5" y2="32" stroke="#3a9ad4" stroke-width="1" opacity="0.5"/>

  <!-- Center crosshair -->
  <line x1="32" y1="26" x2="32" y2="38" stroke="#2a7ab8" stroke-width="0.7" opacity="0.6"/>
  <line x1="26" y1="32" x2="38" y2="32" stroke="#2a7ab8" stroke-width="0.7" opacity="0.6"/>

  <!-- Center rings -->
  <circle cx="32" cy="32" r="7" fill="none" stroke="#2980c4" stroke-width="0.8" opacity="0.5"/>
  <circle cx="32" cy="32" r="4.5" fill="#0d2a45" stroke="#3a9ad4" stroke-width="0.8"/>

  <!-- Center core glow -->
  <circle cx="32" cy="32" r="3" fill="#5bc8ff" opacity="0.5" filter="url(#glow-strong)"/>
  <circle cx="32" cy="32" r="2" fill="#a8e4ff"/>
  <circle cx="32" cy="32" r="1" fill="white"/>

  <!-- Orbiting dot on ring (top) — glow -->
  <circle cx="32" cy="12" r="3.5" fill="#60cfff" opacity="0.5" filter="url(#glow-strong)"/>
  <!-- Orbiting dot sharp -->
  <circle cx="32" cy="12" r="2" fill="white"/>
  <circle cx="32" cy="12" r="1" fill="#cff0ff"/>
</svg>
