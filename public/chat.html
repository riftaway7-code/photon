    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;700&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,1,0&display=swap"
    rel="stylesheet"
  />
  <style>
    body { overflow: hidden; }

    .chat-main {
      height: calc(100vh - 60px);
      display: flex;
      flex-direction: column;
      max-width: 760px;
      margin: 0 auto;
      padding: 0 1rem;
    }

    .chat-header-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1rem 0 0.75rem;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .chat-title {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      font-size: 1.1rem;
      color: var(--accent-bright);
    }

    .chat-online {
      font-size: 0.8rem;
      color: var(--text-dim);
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .online-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--success);
      box-shadow: 0 0 5px var(--success);
    }

    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 1rem 0;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      scroll-behavior: smooth;
    }

    .chat-messages::-webkit-scrollbar { width: 4px; }
    .chat-messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    .chat-msg {
      display: flex;
      flex-direction: column;
      gap: 0.1rem;
      max-width: 100%;
    }

    .chat-msg-meta {
      display: flex;
      align-items: baseline;
      gap: 0.5rem;
    }

    .chat-msg-name {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 600;
      font-size: 0.82rem;
      color: var(--accent-bright);
    }

    .chat-msg.mine .chat-msg-name { color: #c4b5fd; }

    .chat-msg-time {
      font-size: 0.7rem;
      color: var(--text-dim);
    }

    .chat-msg-text {
      font-size: 0.9rem;
      color: var(--text);
      line-height: 1.5;
      word-break: break-word;
      padding: 0.45rem 0.75rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 0 10px 10px 10px;
      display: inline-block;
      max-width: 85%;
    }

    .chat-msg.mine {
      align-items: flex-end;
    }

    .chat-msg.mine .chat-msg-text {
      background: rgba(124, 58, 237, 0.18);
      border-color: rgba(124, 58, 237, 0.35);
      border-radius: 10px 0 10px 10px;
    }

    .chat-msg.mine .chat-msg-meta {
      flex-direction: row-reverse;
    }

    .chat-sys {
      font-size: 0.75rem;
      color: var(--text-dim);
      text-align: center;
      padding: 0.25rem 0;
      font-style: italic;
    }

    .chat-input-area {
      flex-shrink: 0;
      padding: 0.75rem 0 1rem;
      border-top: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .chat-name-row {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.78rem;
      color: var(--text-muted);
    }

    .chat-name-input {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-family: inherit;
      font-size: 0.8rem;
      padding: 0.25rem 0.6rem;
      width: 140px;
      outline: none;
      transition: border-color 0.15s;
    }

    .chat-name-input:focus { border-color: var(--accent); }

    .chat-send-row {
      display: flex;
      gap: 0.5rem;
    }

    .chat-text-input {
      flex: 1;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-family: inherit;
      font-size: 0.9rem;
      padding: 0.55rem 0.9rem;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    .chat-text-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }

    .chat-text-input::placeholder { color: var(--text-dim); }

    .chat-send-btn {
      background: var(--accent);
      border: none;
      border-radius: 10px;
      color: #fff;
      font-family: inherit;
      font-size: 0.88rem;
      font-weight: 600;
      padding: 0.55rem 1.25rem;
      transition: background 0.15s;
      display: flex;
      align-items: center;
      gap: 0.35rem;
    }

    .chat-send-btn:hover { background: #6d28d9; }

    .ctx-menu {
      position: fixed; background: var(--surface); border: 1px solid var(--border);
      border-radius: 8px; box-shadow: 0 8px 24px rgba(0,0,0,0.4); z-index: 1000;
      min-width: 150px; padding: 0.3rem 0; display: none;
    }
    .ctx-menu.open { display: block; }
    .ctx-item {
      display: flex; align-items: center; gap: 0.5rem;
      padding: 0.5rem 0.9rem; font-size: 0.875rem; color: var(--text); cursor: pointer;
      transition: background 0.1s;
    }
    .ctx-item:hover { background: var(--surface2); }
    .ctx-item .material-symbols-rounded { font-size: 1rem; }

    .dm-panels {
      position: fixed; bottom: 0; right: 1rem;
      display: flex; align-items: flex-end; gap: 0.75rem; z-index: 200;
    }
    .dm-panel {
      width: 280px; background: var(--bg2); border: 1px solid var(--border);
      border-bottom: none; border-radius: 10px 10px 0 0;
      display: flex; flex-direction: column;
      box-shadow: 0 -4px 20px rgba(0,0,0,0.3); max-height: 380px;
    }
    .dm-panel-header {
      display: flex; align-items: center; padding: 0.6rem 0.75rem;
      border-bottom: 1px solid var(--border); flex-shrink: 0;
      gap: 0.4rem; cursor: pointer; user-select: none;
    }
    .dm-panel-name {
      flex: 1; font-family: 'Space Grotesk', sans-serif; font-weight: 600;
      font-size: 0.85rem; color: var(--text);
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .dm-panel-btn {
      background: none; border: none; color: var(--text-dim); cursor: pointer;
      padding: 0.2rem; border-radius: 4px; display: flex; align-items: center;
      justify-content: center; transition: color 0.15s, background 0.15s;
    }
    .dm-panel-btn:hover { color: var(--text); background: var(--surface2); }
    .dm-panel-btn .material-symbols-rounded { font-size: 1.1rem; }
    .dm-panel-btn.call-btn { color: #4ade80; }
    .dm-panel-btn.call-btn:hover { background: rgba(74,222,128,0.15); }
    .dm-messages {
      flex: 1; overflow-y: auto; padding: 0.6rem 0.75rem;
      display: flex; flex-direction: column; gap: 0.35rem;
      min-height: 120px; max-height: 240px;
    }
    .dm-messages::-webkit-scrollbar { width: 3px; }
    .dm-messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
    .dm-msg { display: flex; flex-direction: column; gap: 0.1rem; }
    .dm-msg-text {
      font-size: 0.85rem; color: var(--text); padding: 0.35rem 0.6rem;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 0 8px 8px 8px; display: inline-block; max-width: 90%;
      word-break: break-word; line-height: 1.45;
    }
    .dm-msg.mine { align-items: flex-end; }
    .dm-msg.mine .dm-msg-text {
      background: rgba(124,58,237,0.18); border-color: rgba(124,58,237,0.35);
      border-radius: 8px 0 8px 8px;
    }
    .dm-input-area {
      display: flex; gap: 0.4rem; padding: 0.5rem 0.6rem;
      border-top: 1px solid var(--border); flex-shrink: 0;
    }
    .dm-text-input {
      flex: 1; background: var(--surface); border: 1px solid var(--border);
      border-radius: 8px; color: var(--text); font-family: inherit;
      font-size: 0.82rem; padding: 0.4rem 0.6rem; outline: none;
      transition: border-color 0.15s;
    }
    .dm-text-input:focus { border-color: var(--accent); }
    .dm-text-input::placeholder { color: var(--text-dim); }
    .dm-send-btn {
      background: var(--accent); border: none; border-radius: 8px; color: #fff;
      cursor: pointer; padding: 0.4rem 0.6rem; display: flex; align-items: center;
      justify-content: center; transition: background 0.15s; flex-shrink: 0;
    }
    .dm-send-btn:hover { background: #6d28d9; }
    .dm-send-btn .material-symbols-rounded { font-size: 1rem; }
    .dm-panel.minimized .dm-messages,
    .dm-panel.minimized .dm-input-area { display: none; }

    .video-modal {
      position: fixed; inset: 0; z-index: 500; background: rgba(0,0,0,0.85);
      display: none; align-items: center; justify-content: center;
    }
    .video-modal.open { display: flex; }
    .video-modal-inner {
      background: #0a0a10; border: 1px solid var(--border); border-radius: 16px;
      padding: 1.25rem; width: 680px; max-width: 96vw;
      display: flex; flex-direction: column; gap: 1rem;
    }
    .video-modal-title {
      font-family: 'Space Grotesk', sans-serif; font-weight: 600;
      font-size: 1rem; color: var(--text); text-align: center;
    }
    .video-streams { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; }
    .video-box {
      background: #111; border-radius: 10px; aspect-ratio: 16/9;
      overflow: hidden; position: relative; border: 1px solid var(--border);
    }
    .video-box video { width: 100%; height: 100%; object-fit: cover; }
    .video-box-label {
      position: absolute; bottom: 0.5rem; left: 0.5rem; font-size: 0.75rem;
      color: rgba(255,255,255,0.8); background: rgba(0,0,0,0.5);
      border-radius: 4px; padding: 0.2rem 0.4rem;
    }
    .video-controls {
      display: flex; align-items: center; justify-content: center; gap: 1rem;
    }
    .video-ctrl-btn {
      background: var(--surface2); border: 1px solid var(--border); border-radius: 50%;
      color: var(--text); cursor: pointer; width: 48px; height: 48px;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.15s;
    }
    .video-ctrl-btn:hover { background: var(--surface); }
    .video-ctrl-btn .material-symbols-rounded { font-size: 1.3rem; }
    .video-ctrl-btn.end-call { background: #dc2626; border-color: #dc2626; color: #fff; }
    .video-ctrl-btn.end-call:hover { background: #b91c1c; }

    .incoming-call-banner {
      position: fixed; top: 70px; right: 1rem; background: var(--surface);
      border: 1px solid var(--accent); border-radius: 12px; padding: 0.75rem 1rem;
      box-shadow: 0 4px 20px rgba(124,58,237,0.3); z-index: 400;
      display: none; flex-direction: column; gap: 0.5rem; min-width: 220px;
    }
    .incoming-call-banner.show { display: flex; }
    .incoming-call-text { font-size: 0.875rem; color: var(--text); }
    .incoming-call-name {
      font-family: 'Space Grotesk', sans-serif; font-weight: 600;
      color: var(--accent-bright);
    }
    .incoming-call-btns { display: flex; gap: 0.5rem; }
    .icb-btn {
      flex: 1; border: none; border-radius: 8px; font-family: inherit;
      font-size: 0.8rem; font-weight: 600; padding: 0.4rem; cursor: pointer;
      transition: opacity 0.15s;
    }
    .icb-btn:hover { opacity: 0.85; }
    .icb-accept { background: #16a34a; color: #fff; }
    .icb-decline { background: #dc2626; color: #fff; }
  </style>
</head>
<body>
  <nav class="navbar">
    <div class="nav-brand">
      <span class="material-symbols-rounded brand-icon">flare</span>
      <span class="brand-name">photon</span>
    </div>
    <div class="nav-links">
      <a href="/index.html" class="nav-link">Home</a>
      <a href="/games.html" class="nav-link">Games</a>
      <a href="/movies.html" class="nav-link">Movies</a>
      <a href="/browser.html" class="nav-link">Browser</a>
      <a href="/chat.html" class="nav-link active">Chat</a>
      <a href="/tension/" class="nav-link nav-new">(NEW!) Tension</a>
    </div>
  </nav>

  <main class="chat-main">
    <div class="chat-header-bar">
      <span class="chat-title">global chat</span>
      <span class="chat-online">
        <span class="online-dot"></span>
        <span id="onlineCount">0 online</span>
      </span>
    </div>

    <div class="chat-messages" id="chatMessages">
      <div class="chat-sys">connecting...</div>
    </div>

    <div class="chat-input-area">
      <div class="chat-name-row">
        chatting as <input class="chat-name-input" id="nameInput" maxlength="24" />
      </div>
      <div class="chat-send-row">
        <input class="chat-text-input" id="textInput" placeholder="say something..." maxlength="500" />
        <button class="chat-send-btn" id="sendBtn">
          <span class="material-symbols-rounded" style="font-size:1.1rem">send</span>
          send
        </button>
      </div>
    </div>
  </main>

  <div class="ctx-menu" id="ctxMenu">
    <div class="ctx-item" id="ctxDm">
      <span class="material-symbols-rounded">chat</span>
      Send DM
    </div>
  </div>

  <div class="dm-panels" id="dmPanels"></div>

  <div class="video-modal" id="videoModal">
    <div class="video-modal-inner">
      <div class="video-modal-title" id="videoModalTitle">video call</div>
      <div class="video-streams">
        <div class="video-box">
          <video id="remoteVideo" autoplay playsinline></video>
          <div class="video-box-label" id="remoteLabel">them</div>
        </div>
        <div class="video-box">
          <video id="localVideo" autoplay playsinline muted></video>
          <div class="video-box-label">you</div>
        </div>
      </div>
      <div class="video-controls">
        <button class="video-ctrl-btn" id="toggleAudioBtn" title="Toggle mic">
          <span class="material-symbols-rounded">mic</span>
        </button>
        <button class="video-ctrl-btn end-call" id="endCallBtn" title="End call">
          <span class="material-symbols-rounded">call_end</span>
        </button>
        <button class="video-ctrl-btn" id="toggleVideoBtn" title="Toggle camera">
          <span class="material-symbols-rounded">videocam</span>
        </button>
      </div>
    </div>
  </div>

  <div class="incoming-call-banner" id="incomingCallBanner">
    <div class="incoming-call-text">
      <span class="incoming-call-name" id="callerName"></span> is calling...
    </div>
    <div class="incoming-call-btns">
      <button class="icb-btn icb-accept" id="acceptCallBtn">Accept</button>
      <button class="icb-btn icb-decline" id="declineCallBtn">Decline</button>
    </div>
  </div>

  <script>
    function esc(s) {
      return String(s ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
    }

    function fmtTime(ts) {
      const d = new Date(ts);
      return d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
    }

    const NAMES = ["cosmic","neon","solar","lunar","turbo","pixel","glitch","ghost","cyber","hyper"];
    const TAGS  = ["duck","shark","wolf","fox","cat","panda","rabbit","otter","lynx","crow"];
    function randName() {
      return NAMES[Math.random()*NAMES.length|0] + "_" + TAGS[Math.random()*TAGS.length|0];
    }

    let myName = localStorage.getItem("photon-chat-name") || randName();
    localStorage.setItem("photon-chat-name", myName);

    const sid = sessionStorage.getItem("photon-sid") || (Math.random().toString(36).slice(2) + Date.now().toString(36));
    sessionStorage.setItem("photon-sid", sid);

    const msgs     = document.getElementById("chatMessages");
    const nameIn   = document.getElementById("nameInput");
    const textIn   = document.getElementById("textInput");
    const onlineEl = document.getElementById("onlineCount");
    nameIn.value = myName;

    function addMsg(msg) {
      const mine = msg.name === myName;
      const el = document.createElement("div");
      el.className = "chat-msg" + (mine ? " mine" : "");
      el.innerHTML = `
        <div class="chat-msg-meta">
          <span class="chat-msg-name" data-name="${esc(msg.name)}">${esc(msg.name)}</span>
          <span class="chat-msg-time">${fmtTime(msg.time)}</span>
        </div>
        <span class="chat-msg-text">${esc(msg.text)}</span>
      `;
      msgs.appendChild(el);
      msgs.scrollTop = msgs.scrollHeight;
    }

    function addSys(text) {
      const el = document.createElement("div");
      el.className = "chat-sys";
      el.textContent = text;
      msgs.appendChild(el);
      msgs.scrollTop = msgs.scrollHeight;
    }

    let lastTime = 0;
    let seenTimes = new Set();
    let initialized = false;

    async function poll() {
      try {
        const r = await fetch(`/api/chat/messages?since=${lastTime}&sid=${sid}`);
        const { messages, online } = await r.json();
        onlineEl.textContent = `${online} online`;
        if (!initialized) {
          msgs.innerHTML = "";
          if (messages.length === 0) addSys("no messages yet. say hi!");
          initialized = true;
        }
        for (const msg of messages) {
          if (!seenTimes.has(msg.time + msg.name)) {
            seenTimes.add(msg.time + msg.name);
            addMsg(msg);
            if (msg.time > lastTime) lastTime = msg.time;
          }
        }
      } catch {
        if (!initialized) addSys("connection error. retrying...");
      }
    }

    poll();
    setInterval(poll, 2000);

    nameIn.addEventListener("change", () => {
      myName = nameIn.value.trim() || myName;
      nameIn.value = myName;
      localStorage.setItem("photon-chat-name", myName);
    });

    async function send() {
      const text = textIn.value.trim();
      if (!text) return;
      textIn.value = "";
      myName = nameIn.value.trim() || myName;
      nameIn.value = myName;
      localStorage.setItem("photon-chat-name", myName);
      await fetch("/api/chat/send", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ name: myName, text }),
      }).catch(() => {});
    }

    document.getElementById("sendBtn").addEventListener("click", send);
    textIn.addEventListener("keydown", e => { if (e.key === "Enter") send(); });

    const ctxMenu = document.getElementById("ctxMenu");
    let ctxTarget = null;

    document.addEventListener("click", () => { ctxMenu.classList.remove("open"); ctxTarget = null; });
    document.addEventListener("contextmenu", (e) => {
      const nameEl = e.target.closest(".chat-msg-name");
      if (!nameEl) return;
      const name = nameEl.dataset.name;
      if (!name || name === myName) return;
      e.preventDefault();
      ctxTarget = name;
      ctxMenu.style.left = Math.min(e.clientX, window.innerWidth - 170) + "px";
      ctxMenu.style.top = Math.min(e.clientY, window.innerHeight - 80) + "px";
      ctxMenu.classList.add("open");
    });
    document.getElementById("ctxDm").addEventListener("click", () => {
      if (ctxTarget) openDmPanel(ctxTarget);
      ctxMenu.classList.remove("open");
      ctxTarget = null;
    });

    const dmPanels = new Map();

    function openDmPanel(withName) {
      if (dmPanels.has(withName)) {
        dmPanels.get(withName).el.classList.remove("minimized");
        return;
      }
      const el = document.createElement("div");
      el.className = "dm-panel";
      el.innerHTML = `
        <div class="dm-panel-header">
          <span class="material-symbols-rounded" style="font-size:0.9rem;color:var(--accent-bright)">person</span>
          <span class="dm-panel-name">${esc(withName)}</span>
          <button class="dm-panel-btn call-btn" title="Video call"><span class="material-symbols-rounded">videocam</span></button>
          <button class="dm-panel-btn minimize-btn" title="Minimize"><span class="material-symbols-rounded">remove</span></button>
          <button class="dm-panel-btn close-btn" title="Close"><span class="material-symbols-rounded">close</span></button>
        </div>
        <div class="dm-messages"></div>
        <div class="dm-input-area">
          <input class="dm-text-input" placeholder="Message ${esc(withName)}..." maxlength="500" />
          <button class="dm-send-btn"><span class="material-symbols-rounded">send</span></button>
        </div>
      `;
      const msgsEl   = el.querySelector(".dm-messages");
      const textIn2  = el.querySelector(".dm-text-input");
      const sendBtn2 = el.querySelector(".dm-send-btn");
      let dmLastTime = 0;
      const dmSeen = new Set();

      function addDmMsg(msg) {
        const mine = msg.from === myName;
        const m = document.createElement("div");
        m.className = "dm-msg" + (mine ? " mine" : "");
        m.innerHTML = `<span class="dm-msg-text">${esc(msg.text)}</span>`;
        msgsEl.appendChild(m);
        msgsEl.scrollTop = msgsEl.scrollHeight;
      }

      async function dmPoll() {
        try {
          const r = await fetch(`/api/dm/messages?from=${encodeURIComponent(myName)}&to=${encodeURIComponent(withName)}&since=${dmLastTime}`);
          const { messages } = await r.json();
          for (const msg of messages) {
            const k = msg.time + msg.from;
            if (!dmSeen.has(k)) { dmSeen.add(k); addDmMsg(msg); if (msg.time > dmLastTime) dmLastTime = msg.time; }
          }
        } catch {}
      }

      async function dmSend() {
        const text = textIn2.value.trim();
        if (!text) return;
        textIn2.value = "";
        await fetch("/api/dm/send", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ from: myName, to: withName, text }),
        }).catch(() => {});
      }

      sendBtn2.addEventListener("click", dmSend);
      textIn2.addEventListener("keydown", e => { if (e.key === "Enter") dmSend(); });
      el.querySelector(".minimize-btn").addEventListener("click", (e) => { e.stopPropagation(); el.classList.toggle("minimized"); });
      el.querySelector(".dm-panel-header").addEventListener("click", () => { if (el.classList.contains("minimized")) el.classList.remove("minimized"); });
      el.querySelector(".close-btn").addEventListener("click", (e) => { e.stopPropagation(); clearInterval(iv); el.remove(); dmPanels.delete(withName); });
      el.querySelector(".call-btn").addEventListener("click", (e) => { e.stopPropagation(); startVideoCall(withName); });

      const iv = setInterval(dmPoll, 2000);
      dmPoll();
      dmPanels.set(withName, { el });
      document.getElementById("dmPanels").appendChild(el);
    }

    let peerConn = null;
    let localStream = null;
    let callPeer = null;
    let pendingSignal = null;
    const STUN = { iceServers: [{ urls: "stun:stun.l.google.com:19302" }] };

    async function pollSignals() {
      try {
        const r = await fetch(`/api/signal?to=${encodeURIComponent(myName)}`);
        const { signals } = await r.json();
        for (const sig of signals) handleSignal(sig);
      } catch {}
    }
    setInterval(pollSignals, 2000);

    function handleSignal(sig) {
      if (sig.type === "offer") {
        pendingSignal = sig;
        document.getElementById("callerName").textContent = sig.from;
        document.getElementById("incomingCallBanner").classList.add("show");
      } else if (sig.type === "answer" && peerConn) {
        peerConn.setRemoteDescription(new RTCSessionDescription(sig.data)).catch(() => {});
      } else if (sig.type === "ice" && peerConn) {
        peerConn.addIceCandidate(new RTCIceCandidate(sig.data)).catch(() => {});
      } else if (sig.type === "hangup") {
        endCall(false);
      }
    }

    document.getElementById("acceptCallBtn").addEventListener("click", async () => {
      document.getElementById("incomingCallBanner").classList.remove("show");
      if (!pendingSignal) return;
      const { from, data } = pendingSignal;
      pendingSignal = null;
      callPeer = from;
      document.getElementById("remoteLabel").textContent = from;
      document.getElementById("videoModalTitle").textContent = `call with ${from}`;
      document.getElementById("videoModal").classList.add("open");
      await setupPeerConn();
      try {
        await peerConn.setRemoteDescription(new RTCSessionDescription(data));
        const answer = await peerConn.createAnswer();
        await peerConn.setLocalDescription(answer);
        await fetch("/api/signal", { method: "POST", headers: { "content-type": "application/json" },
          body: JSON.stringify({ from: myName, to: from, type: "answer", data: answer }) });
      } catch { endCall(false); }
    });

    document.getElementById("declineCallBtn").addEventListener("click", () => {
      document.getElementById("incomingCallBanner").classList.remove("show");
      if (pendingSignal) {
        fetch("/api/signal", { method: "POST", headers: { "content-type": "application/json" },
          body: JSON.stringify({ from: myName, to: pendingSignal.from, type: "hangup" }) }).catch(() => {});
      }
      pendingSignal = null;
    });

    async function startVideoCall(toName) {
      callPeer = toName;
      document.getElementById("remoteLabel").textContent = toName;
      document.getElementById("videoModalTitle").textContent = `call with ${toName}`;
      document.getElementById("videoModal").classList.add("open");
      await setupPeerConn();
      try {
        const offer = await peerConn.createOffer();
        await peerConn.setLocalDescription(offer);
        await fetch("/api/signal", { method: "POST", headers: { "content-type": "application/json" },
          body: JSON.stringify({ from: myName, to: toName, type: "offer", data: offer }) });
      } catch { endCall(false); }
    }

    async function setupPeerConn() {
      peerConn = new RTCPeerConnection(STUN);
      try {
        localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
        document.getElementById("localVideo").srcObject = localStream;
        for (const t of localStream.getTracks()) peerConn.addTrack(t, localStream);
      } catch {}
      peerConn.ontrack = (e) => { document.getElementById("remoteVideo").srcObject = e.streams[0]; };
      peerConn.onicecandidate = (e) => {
        if (e.candidate && callPeer) {
          fetch("/api/signal", { method: "POST", headers: { "content-type": "application/json" },
            body: JSON.stringify({ from: myName, to: callPeer, type: "ice", data: e.candidate }) }).catch(() => {});
        }
      };
      peerConn.onconnectionstatechange = () => {
        if (peerConn && ["failed", "disconnected", "closed"].includes(peerConn.connectionState)) endCall(false);
      };
    }

    function endCall(notify = true) {
      if (notify && callPeer) {
        fetch("/api/signal", { method: "POST", headers: { "content-type": "application/json" },
          body: JSON.stringify({ from: myName, to: callPeer, type: "hangup" }) }).catch(() => {});
      }
      if (peerConn) { peerConn.close(); peerConn = null; }
      if (localStream) { localStream.getTracks().forEach(t => t.stop()); localStream = null; }
      document.getElementById("localVideo").srcObject = null;
      document.getElementById("remoteVideo").srcObject = null;
      document.getElementById("videoModal").classList.remove("open");
      callPeer = null;
    }

    document.getElementById("endCallBtn").addEventListener("click", () => endCall(true));

    let vidMuted = false;
    let audMuted = false;
    document.getElementById("toggleVideoBtn").addEventListener("click", () => {
      if (!localStream) return;
      vidMuted = !vidMuted;
      localStream.getVideoTracks().forEach(t => { t.enabled = !vidMuted; });
      document.getElementById("toggleVideoBtn").querySelector(".material-symbols-rounded").textContent = vidMuted ? "videocam_off" : "videocam";
    });
    document.getElementById("toggleAudioBtn").addEventListener("click", () => {
      if (!localStream) return;
      audMuted = !audMuted;
      localStream.getAudioTracks().forEach(t => { t.enabled = !audMuted; });
      document.getElementById("toggleAudioBtn").querySelector(".material-symbols-rounded").textContent = audMuted ? "mic_off" : "mic";
    });
  </script>
  <script src="/js/bg.js"></script>
  <script src="/js/transitions.js"></script>
</body>
</html>
