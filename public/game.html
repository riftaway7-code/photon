<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Activity — Photon</title>
  <meta name="description" content="Launch an interactive challenge on Photon. Hundreds of activities available, free and instant." />
  <meta name="keywords" content="photon, interactive activity, skill challenge, brain training, free, instant" />
  <meta name="robots" content="index, follow" />
  <meta property="og:title" content="Activity — Photon" />
  <meta property="og:description" content="Launch an interactive challenge. Free and instant." />
  <meta property="og:type" content="website" />
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;700&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,1,0&display=swap"
    rel="stylesheet"
  />
  <style>
    body { overflow: hidden; }

    .game-navbar {
      display: flex;
      align-items: center;
      height: 60px;
      padding: 0 1rem;
      background: rgba(10, 10, 15, 0.95);
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(16px);
    }

    .game-nav-section {
      flex: 1;
      display: flex;
      align-items: center;
    }

    .game-nav-section.center { justify-content: center; }
    .game-nav-section.right  { justify-content: flex-end; }

    .game-nav-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      font-size: 1.25rem;
      color: var(--text);
    }

    .game-title-label {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 600;
      font-size: 1rem;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 400px;
    }

    .game-close-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      padding: 0.4rem;
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 0.2s, background 0.2s;
    }

    .game-close-btn:hover { color: var(--text); background: var(--surface2); }

    .game-close-btn .material-symbols-rounded { font-size: 1.4rem; }

    .game-viewport {
      width: 100%;
      height: calc(100vh - 60px);
      border: none;
      display: block;
      background: #000;
    }
  </style>
</head>
<body>
  <nav class="game-navbar">
    <div class="game-nav-section">
      <a href="/games.html" class="game-nav-brand">
        <span class="material-symbols-rounded brand-icon">flare</span>
        <span class="brand-name">photon</span>
      </a>
    </div>
    <div class="game-nav-section center">
      <span class="game-title-label" id="gameTitle"></span>
    </div>
    <div class="game-nav-section right">
      <a href="/settings.html" class="game-close-btn" title="Settings">
        <span class="material-symbols-rounded">settings</span>
      </a>
      <button class="game-close-btn" id="closeBtn">
        <span class="material-symbols-rounded">close</span>
      </button>
    </div>
  </nav>
  <iframe id="gameFrame" class="game-viewport" allowfullscreen></iframe>
  <script type="module">
    const params = new URLSearchParams(location.search);
    const gameUrl = params.get("url");
    const title = params.get("title") || "Game";
    history.replaceState({}, "", "/game.html");
    document.getElementById("gameTitle").textContent = title;
    document.title = title + " — Photon";
    document.getElementById("closeBtn").addEventListener("click", () => history.back());

    const frame = document.getElementById("gameFrame");

    async function init() {
      const localWisp = `${location.protocol === "https:" ? "wss" : "ws"}://${location.host}/wisp/`;
      const hasLocalWisp = await fetch("/api/wisp-available").then(r => r.ok).catch(() => false);
      const WISP = hasLocalWisp ? localWisp : "wss://anura.pro/wisp/";

      const { ScramjetController } = await import("/scramjet/scramjet.bundle.js");
      const { BareMuxConnection } = await import("/bare-mux/index.mjs");

      const controller = new ScramjetController({
        prefix: "/scramjet/",
        files: {
          wasm: "/scramjet/scramjet.wasm.wasm",
          all:  "/scramjet/scramjet.all.js",
          sync: "/scramjet/scramjet.sync.js",
        },
      });

      const existing = await navigator.serviceWorker.getRegistrations();
      await Promise.all(existing.map((r) => r.unregister()));
      if (existing.length > 0) await new Promise((r) => setTimeout(r, 600));
      await controller.init();
      const reg = await navigator.serviceWorker.register("/sw.js", { scope: "/scramjet/" });
      await new Promise((resolve) => {
        if (reg.active) { resolve(); return; }
        const sw = reg.installing || reg.waiting;
        if (!sw) { resolve(); return; }
        sw.addEventListener("statechange", function handler() {
          if (this.state === "activated") { this.removeEventListener("statechange", handler); resolve(); }
        });
      });
      const conn = new BareMuxConnection("/bare-mux/worker.js");
      await conn.setTransport("/epoxy/index.mjs", [{ wisp: WISP }]);
      if (gameUrl) frame.src = controller.encodeUrl(gameUrl);
    }

    (async () => {
      try {
        await init();
      } catch (err) {
        console.error("Proxy failed, loading game directly:", err);
        if (gameUrl) frame.src = gameUrl;
      }
    })();
  </script>
  <script src="/js/bg.js"></script>
  <script src="/js/transitions.js"></script>
</body>
</html>
