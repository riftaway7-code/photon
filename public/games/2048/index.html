<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>2048</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #0a0a0f;
      color: #eee;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      user-select: none;
    }
    h1 { font-size: 2.5rem; margin-bottom: 0.5rem; color: #a78bfa; }
    .meta { display: flex; gap: 2rem; margin-bottom: 1.5rem; font-size: 1rem; color: #888; }
    .meta span { color: #e8e8f0; font-weight: 600; }
    #board {
      display: grid;
      grid-template-columns: repeat(4, 90px);
      grid-template-rows: repeat(4, 90px);
      gap: 10px;
      background: #1a1a2e;
      border-radius: 12px;
      padding: 10px;
    }
    .cell {
      width: 90px; height: 90px;
      border-radius: 8px;
      background: #0f0f1a;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.6rem; font-weight: 700;
      transition: background 0.1s, transform 0.1s;
    }
    .c2   { background: #312e81; color: #c4b5fd; }
    .c4   { background: #3730a3; color: #c4b5fd; }
    .c8   { background: #4c1d95; color: #e9d5ff; }
    .c16  { background: #6d28d9; color: #fff; }
    .c32  { background: #7c3aed; color: #fff; }
    .c64  { background: #8b5cf6; color: #fff; font-size: 1.4rem; }
    .c128 { background: #a78bfa; color: #1e1b4b; font-size: 1.2rem; }
    .c256 { background: #c4b5fd; color: #1e1b4b; font-size: 1.1rem; }
    .c512 { background: #ddd6fe; color: #1e1b4b; font-size: 1rem; }
    .c1024{ background: #ede9fe; color: #1e1b4b; font-size: 0.9rem; }
    .c2048{ background: #f5f3ff; color: #1e1b4b; font-size: 0.85rem; }
    .btn {
      margin-top: 1.5rem;
      padding: 0.6rem 1.5rem;
      background: #7c3aed;
      border: none;
      border-radius: 20px;
      color: #fff;
      font-size: 1rem;
      cursor: pointer;
    }
    .btn:hover { background: #6d28d9; }
    .msg { margin-top: 1rem; font-size: 1.1rem; color: #a78bfa; min-height: 1.5rem; }
  </style>
</head>
<body>
  <h1>2048</h1>
  <div class="meta">Score: <span id="score">0</span> &nbsp; Best: <span id="best">0</span></div>
  <div id="board"></div>
  <p class="msg" id="msg"></p>
  <button class="btn" onclick="init()">New Game</button>
  <script>
    let grid, score, best = +localStorage.getItem('2048best') || 0;
    const boardEl = document.getElementById('board');
    const scoreEl = document.getElementById('score');
    const bestEl  = document.getElementById('best');
    const msgEl   = document.getElementById('msg');

    function init() {
      grid = Array.from({length:4}, () => Array(4).fill(0));
      score = 0; msgEl.textContent = ''; scoreEl.textContent = 0; bestEl.textContent = best;
      addTile(); addTile(); render();
    }

    function addTile() {
      const empty = [];
      for (let r=0;r<4;r++) for (let c=0;c<4;c++) if (!grid[r][c]) empty.push([r,c]);
      if (!empty.length) return;
      const [r,c] = empty[Math.floor(Math.random()*empty.length)];
      grid[r][c] = Math.random()<0.9 ? 2 : 4;
    }

    function render() {
      boardEl.innerHTML = '';
      for (let r=0;r<4;r++) for (let c=0;c<4;c++) {
        const v = grid[r][c];
        const cell = document.createElement('div');
        cell.className = 'cell' + (v ? ' c'+v : '');
        cell.textContent = v || '';
        boardEl.appendChild(cell);
      }
    }

    function slide(row) {
      let arr = row.filter(x=>x), merged = false;
      for (let i=0;i<arr.length-1;i++) {
        if (!merged && arr[i]===arr[i+1]) { arr[i]*=2; score+=arr[i]; arr.splice(i+1,1); merged=true; }
        else merged=false;
      }
      while(arr.length<4) arr.push(0);
      return arr;
    }

    function move(dir) {
      const prev = JSON.stringify(grid);
      if (dir==='left')  for(let r=0;r<4;r++) grid[r]=slide(grid[r]);
      if (dir==='right') for(let r=0;r<4;r++) grid[r]=slide(grid[r].reverse()).reverse();
      if (dir==='up')    for(let c=0;c<4;c++){let col=grid.map(r=>r[c]);col=slide(col);grid.forEach((r,i)=>r[c]=col[i]);}
      if (dir==='down')  for(let c=0;c<4;c++){let col=grid.map(r=>r[c]).reverse();col=slide(col).reverse();grid.forEach((r,i)=>r[c]=col[i]);}
      if (JSON.stringify(grid)!==prev) { addTile(); render(); updateScore(); checkEnd(); }
    }

    function updateScore() {
      scoreEl.textContent = score;
      if (score > best) { best = score; localStorage.setItem('2048best', best); bestEl.textContent = best; }
    }

    function checkEnd() {
      if (grid.flat().includes(2048)) { msgEl.textContent = '🎉 You win!'; return; }
      for(let r=0;r<4;r++) for(let c=0;c<4;c++) {
        if (!grid[r][c]) return;
        if (c<3&&grid[r][c]===grid[r][c+1]) return;
        if (r<3&&grid[r][c]===grid[r+1][c]) return;
      }
      msgEl.textContent = 'Game over!';
    }

    const KEYS = {ArrowLeft:'left',ArrowRight:'right',ArrowUp:'up',ArrowDown:'down'};
    document.addEventListener('keydown', e => { if(KEYS[e.key]){e.preventDefault();move(KEYS[e.key]);} });

    let tx, ty;
    document.addEventListener('touchstart', e => { tx=e.touches[0].clientX; ty=e.touches[0].clientY; }, {passive:true});
    document.addEventListener('touchend', e => {
      const dx=e.changedTouches[0].clientX-tx, dy=e.changedTouches[0].clientY-ty;
      if(Math.abs(dx)>Math.abs(dy)) move(dx>0?'right':'left');
      else move(dy>0?'down':'up');
    });

    init();
  </script>
</body>
</html>
