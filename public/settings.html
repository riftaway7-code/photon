<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Google tag (gtag.js) -->

  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Settings — Photon</title>
  <meta name="description" content="Manage your Photon account, save progress, and customize your theme." />
  <meta name="robots" content="index, follow" />
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;700&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,1,0&display=swap" rel="stylesheet" />
  <style>
    .settings-main {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      min-height: calc(100vh - 60px);
      padding: 2rem;
    }

    .settings-container {
      max-width: 500px;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 2rem;
    }

    .settings-section {
      padding: 2rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
    }

    .settings-title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 1.5rem;
      color: var(--text);
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      margin-bottom: 1rem;
    }

    .form-label {
      font-size: 0.9rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    .form-input {
      padding: 0.75rem 1rem;
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text);
      font-family: inherit;
      font-size: 1rem;
      transition: border-color 0.2s;
    }

    .form-input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }

    .btn {
      padding: 0.75rem 1.5rem;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: var(--radius-sm);
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s, opacity 0.2s;
    }

    .btn:hover {
      opacity: 0.9;
      transform: translateY(-2px);
    }

    .btn-secondary {
      background: var(--bg2);
      color: var(--text);
      border: 1px solid var(--border);
    }

    .theme-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
      margin-bottom: 1rem;
    }

    .theme-option {
      padding: 1rem;
      border: 2px solid var(--border);
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: all 0.2s;
      text-align: center;
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    .theme-option:hover {
      border-color: var(--accent);
    }

    .theme-option.active {
      border-color: var(--accent);
      background: var(--accent-glow);
      color: var(--accent-bright);
      font-weight: 600;
    }

    .theme-preview {
      width: 100%;
      height: 60px;
      border-radius: 8px;
      margin-bottom: 0.5rem;
    }

    .profile-info {
      padding: 1rem;
      background: var(--bg);
      border-radius: var(--radius-sm);
      margin-bottom: 1rem;
    }

    .info-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.5rem 0;
      font-size: 0.9rem;
    }

    .info-label {
      color: var(--text-muted);
    }

    .info-value {
      color: var(--text);
      font-weight: 500;
    }

    .error-msg {
      color: var(--danger);
      font-size: 0.85rem;
      margin-top: 0.5rem;
    }

    .success-msg {
      color: var(--success);
      font-size: 0.85rem;
      margin-top: 0.5rem;
    }

    #authSection {
      display: none;
    }

    #authSection.show {
      display: block;
    }

    #profileSection {
      display: none;
    }

    #profileSection.show {
      display: block;
    }
  </style>
</head>
<body>
  <nav class="navbar">
    <div class="nav-brand">
      <span class="material-symbols-rounded brand-icon">flare</span>
      <span class="brand-name">photon</span>
    </div>
    <div class="nav-links">
      <a href="/index.html" class="nav-link">Home</a>
      <a href="/games.html" class="nav-link">Games</a>
      <a href="/movies.html" class="nav-link">Movies</a>
      <a href="/browser.html" class="nav-link">Browser</a>
      <a href="/chat.html" class="nav-link">Chat</a>
      <a href="/settings.html" class="nav-link active">Settings</a>
    </div>
  </nav>

  <main class="settings-main">
    <div class="settings-container">
      <!-- Auth Section -->
      <div id="authSection" class="settings-section">
        <div class="settings-title">Account</div>
        <div class="form-group">
          <label class="form-label">Username</label>
          <input type="text" id="authUsername" class="form-input" placeholder="Enter username" />
        </div>
        <div class="form-group">
          <label class="form-label">Password</label>
          <input type="password" id="authPassword" class="form-input" placeholder="Enter password" />
        </div>
        <button class="btn" id="loginBtn">Login</button>
        <button class="btn btn-secondary" id="signupBtn" style="margin-top: 0.5rem;">Create Account</button>
        <div id="authError" class="error-msg"></div>
      </div>

      <!-- Profile Section -->
      <div id="profileSection" class="settings-section">
        <div class="settings-title">Profile</div>
        <div class="profile-info">
          <div class="info-row">
            <span class="info-label">Username</span>
            <span class="info-value" id="profileUsername">—</span>
          </div>
          <div class="info-row">
            <span class="info-label">Account Created</span>
            <span class="info-value" id="profileCreated">—</span>
          </div>
          <div class="info-row">
            <span class="info-label">Last Login</span>
            <span class="info-value" id="profileLastLogin">—</span>
          </div>
        </div>
        <button class="btn btn-secondary" id="logoutBtn" style="width: 100%;">Logout</button>
      </div>

      <!-- Theme Section -->
      <div class="settings-section">
        <div class="settings-title">Theme</div>
        <div class="theme-grid">
          <div class="theme-option" data-theme="shadow">
            <div class="theme-preview" style="background: linear-gradient(to right, #1a1a2e, #2d2d48);"></div>
            Shadow
          </div>
          <div class="theme-option" data-theme="black">
            <div class="theme-preview" style="background: linear-gradient(to right, #000000, #1a1a1a);"></div>
            Black
          </div>
          <div class="theme-option" data-theme="sky">
            <div class="theme-preview" style="background: linear-gradient(to right, #e8f2ff, #f8faff);"></div>
            Sky
          </div>
          <div class="theme-option" data-theme="white">
            <div class="theme-preview" style="background: linear-gradient(to right, #f8f8f8, #ffffff);"></div>
            White
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="/js/bg.js"></script>
  <script src="/js/transitions.js"></script>
  <script src="/js/settings.js" type="module"></script>
</body>
</html>
