<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-51HHNSKYW4"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-51HHNSKYW4');
  </script>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Web Explorer — Photon</title>
  <meta name="description" content="Freely browse and research the web with Photon's built-in web explorer. Fast, private, and accessible from any network." />
  <meta name="keywords" content="photon, web explorer, student research, free browsing, fast, private, accessible" />
  <meta name="robots" content="index, follow" />
  <meta property="og:title" content="Web Explorer — Photon" />
  <meta property="og:description" content="Browse and research the web freely. Fast, private, and accessible from any network." />
  <meta property="og:type" content="website" />
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;700&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,1,0&display=swap"
    rel="stylesheet"
  />
</head>
<body>
  <nav class="navbar">
    <div class="nav-brand">
      <span class="material-symbols-rounded brand-icon">flare</span>
      <span class="brand-name">photon</span>
    </div>
    <div class="nav-links">
      <a href="/index.html" class="nav-link">Home</a>
      <a href="/games.html" class="nav-link">Games</a>
      <a href="/movies.html" class="nav-link">Movies</a>
      <a href="/browser.html" class="nav-link active">Browser</a>
      <a href="/chat.html" class="nav-link">Chat</a>
      <a href="/settings.html" class="nav-link">Settings</a>
    </div>
  </nav>

  <main class="browser-main">
    <div class="browser-shell">

      <div class="toolbar-peek" id="toolbarPeek">
        <span class="material-symbols-rounded">expand_more</span>
      </div>

      <div class="browser-toolbar" id="browserToolbar">
        <div class="browser-toolbar-row">
          <button class="browser-btn" id="backBtn" title="Back">
            <span class="material-symbols-rounded">arrow_back</span>
          </button>
          <button class="browser-btn" id="forwardBtn" title="Forward">
            <span class="material-symbols-rounded">arrow_forward</span>
          </button>
          <button class="browser-btn" id="reloadBtn" title="Reload">
            <span class="material-symbols-rounded">refresh</span>
          </button>
          <div class="url-bar-wrapper">
            <span class="material-symbols-rounded url-lock">lock</span>
            <input id="urlBar" class="url-bar" type="text" placeholder="Search or enter a URL..." spellcheck="false" />
            <button class="url-go" id="goBtn">Go</button>
          </div>
        </div>
        <div class="browser-loading-bar" id="loadingBar"></div>
      </div>

      <div class="browser-content" id="browserContent">
        <div class="browser-start">
          <div class="start-logo">
            <span class="material-symbols-rounded brand-icon large">flare</span>
            <h2>Photon Browser</h2>
            <p>Powered by Scramjet &mdash; browse freely.</p>
          </div>
          <div class="quick-links">
            <button class="quick-link" data-url="https://google.com">Google</button>
            <button class="quick-link" data-url="https://youtube.com">YouTube</button>
            <button class="quick-link" data-url="https://reddit.com">Reddit</button>
            <button class="quick-link" data-url="https://github.com">GitHub</button>
            <button class="quick-link" data-url="https://wikipedia.org">Wikipedia</button>
            <button class="quick-link" data-url="https://twitch.tv">Twitch</button>
          </div>
        </div>
      </div>

      <div class="nav-loading hidden" id="navLoading">
        <div class="nav-loading-spinner">
          <div class="spinner-ring"></div>
          <div class="spinner-ring ring2"></div>
          <span class="material-symbols-rounded spinner-icon">flare</span>
        </div>
        <p class="nav-loading-msg" id="navLoadingMsg">Loading the loading...</p>
      </div>

      <iframe id="proxyFrame" class="proxy-frame hidden" sandbox="allow-forms allow-pointer-lock allow-popups allow-same-origin allow-scripts allow-top-navigation-by-user-activation"></iframe>

      <div class="browser-blocked hidden" id="browserBlocked">
        <div class="caution-tape caution-tape-left"></div>
        <div class="caution-tape caution-tape-right"></div>
        <div class="blocked-label">
          <span class="material-symbols-rounded" style="font-size:2.5rem">block</span>
          <p>Proxy not available on this server.</p>
          <p style="opacity:.6;font-size:.85rem">The Browser page requires a server that supports WebSockets.</p>
        </div>
      </div>
    </div>
  </main>

  <script type="module" src="/js/browser.js"></script>
<script src="/js/bg.js"></script>
<script src="/js/transitions.js"></script>
</body>
</html>
