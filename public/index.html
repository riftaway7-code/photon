    rel="stylesheet"

  <style>
    .home-main {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: calc(100vh - 60px);
      padding: 2rem;
      text-align: center;
    }

    .home-logo {
      font-size: 5rem;
      color: var(--accent-bright);
      text-shadow: 0 0 60px var(--accent-glow), 0 0 120px rgba(124, 58, 237, 0.15);
      line-height: 1;
      margin-bottom: 1.5rem;
      animation: float 4s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    .home-title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: clamp(3rem, 8vw, 5.5rem);
      font-weight: 700;
      letter-spacing: -2px;
      line-height: 1;
      margin-bottom: 1rem;
    }

    .home-face-wrap {
      position: relative;
      display: inline-block;
    }

    .home-face {
      position: absolute;
      left: 50%;
      top: 88%;
      transform: translateX(-50%) rotate(-90deg);
      font-size: 0.3em;
      font-weight: 700;
      letter-spacing: 0;
      opacity: 0.7;
    }

    .home-sub {
      font-size: 1.15rem;
      color: var(--text-muted);
      max-width: 420px;
      margin-bottom: 3rem;
    }

    .home-cards {
      display: flex;
      gap: 1.25rem;
      flex-wrap: wrap;
      justify-content: center;
    }

    .home-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
      padding: 2.5rem 3rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      text-decoration: none;
      color: var(--text);
      min-width: 200px;
      transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
      cursor: pointer;
    }

    .home-card:hover {
      transform: translateY(-6px);
      border-color: var(--accent);
      box-shadow: 0 12px 40px rgba(124, 58, 237, 0.3);
    }

    .home-card-icon {
      font-size: 2.75rem;
      color: var(--accent-bright);
    }

    .home-card-label {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.2rem;
      font-weight: 700;
    }

    .home-card-desc {
      font-size: 0.85rem;
      color: var(--text-muted);
      text-align: center;
    }

    .home-card-new {
      border-color: rgba(34, 197, 94, 0.3);
      position: relative;
    }

    .home-card-new:hover {
      border-color: #22c55e;
      box-shadow: 0 12px 40px rgba(34, 197, 94, 0.25);
    }

    .home-card-new .home-card-icon { color: #22c55e; }

    .home-card-badge {
      position: absolute;
      top: -10px;
      right: 12px;
      background: #22c55e;
      color: #000;
      font-size: 0.65rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      padding: 2px 7px;
      border-radius: 20px;
    }

    .live-count {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.9rem;
      color: var(--text-muted);
      margin-bottom: 2.5rem;
    }

    .live-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #22c55e;
      box-shadow: 0 0 6px #22c55e;
      animation: pulse-dot 2s ease-in-out infinite;
    }

    @keyframes pulse-dot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(0.8); }
    }
  </style>
</head>
<body>
  <nav class="navbar">
    <div class="nav-brand">
      <span class="material-symbols-rounded brand-icon">flare</span>
      <span class="brand-name">photon</span>
    </div>
    <div class="nav-links">
      <a href="/index.html" class="nav-link active">Home</a>
      <a href="/games.html" class="nav-link">Games</a>
      <a href="/movies.html" class="nav-link">Movies</a>
      <a href="/browser.html" class="nav-link">Browser</a>
      <a href="/chat.html" class="nav-link">Chat</a>
      <a href="/settings.html" class="nav-link">Settings</a>
      <a href="/tension/" class="nav-link nav-new">(NEW!) Tension</a>
    </div>
  </nav>

  <main class="home-main">
    <span class="material-symbols-rounded home-logo">flare</span>
    <h1 class="home-title"><span class="glow">ph<span class="home-face-wrap">oton<span class="home-face">D</span></span></span></h1>
    <div class="live-count">
      <span class="live-dot"></span>
      <span id="liveCount">—</span> online now
      <span style="margin: 0 0.5rem; opacity: 0.3">|</span>
      <span id="totalCount">—</span> total visitors
    </div>
    <div class="home-cards">
      <a href="/games.html" class="home-card">
        <span class="material-symbols-rounded home-card-icon">sports_esports</span>
        <span class="home-card-label">Games</span>
      </a>
      <a href="/browser.html" class="home-card">
        <span class="material-symbols-rounded home-card-icon">public</span>
        <span class="home-card-label">Browser</span>
      </a>
      <a href="/chat.html" class="home-card">
        <span class="material-symbols-rounded home-card-icon">chat</span>
        <span class="home-card-label">Chat</span>
      </a>
      <a href="/tension/" class="home-card home-card-new">
        <span class="material-symbols-rounded home-card-icon">sports_martial_arts</span>
        <span class="home-card-label">Tension</span>
        <span class="home-card-desc">Multiplayer obby · answer right or fall</span>
        <span class="home-card-badge">NEW</span>
      </a>
    </div>
  </main>
<script src="/js/bg.js"></script>
<script src="/js/transitions.js"></script>
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
  import { getDatabase, ref, push, onValue, onDisconnect, set, runTransaction } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js";

  const app = initializeApp({
    apiKey: "AIzaSyByY5wDEi3GekZFCdKWRDQcHH2H7490OFg",
    authDomain: "photon-ubg.firebaseapp.com",
    databaseURL: "https://photon-ubg-default-rtdb.firebaseio.com",
    projectId: "photon-ubg",
    storageBucket: "photon-ubg.firebasestorage.app",
    messagingSenderId: "907782814221",
    appId: "1:907782814221:web:5e2c2eeb4e313576e0b344"
  });

  const db = getDatabase(app);
  const presenceRef = ref(db, 'presence');
  const myRef = push(presenceRef);
  onDisconnect(myRef).remove();
  set(myRef, true);

  onValue(presenceRef, (snap) => {
    const count = snap.size ?? 0;
    document.getElementById('liveCount').textContent = count;
  });

  const totalRef = ref(db, 'totalVisits');
  if (!sessionStorage.getItem('photon_counted')) {
    runTransaction(totalRef, (val) => (val || 0) + 1);
    sessionStorage.setItem('photon_counted', 'true');
  }
  onValue(totalRef, (snap) => {
    document.getElementById('totalCount').textContent = (snap.val() || 0).toLocaleString();
  });
</script>
</body>
</html>
